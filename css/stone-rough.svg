<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="relief" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" seed="6" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="5" diffuseConstant="1.05" lighting-color="#b9bec4">
        <feDistantLight azimuth="225" elevation="46"/>
      </feDiffuseLighting>
    </filter>
    <filter id="fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="3" seed="19" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="2.4" diffuseConstant="1" lighting-color="#ffffff">
        <feDistantLight azimuth="225" elevation="52"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <rect width="512" height="512" filter="url(#relief)"/>
  <rect width="512" height="512" filter="url(#fine)" opacity=".38" style="mix-blend-mode:multiply"/>
</svg>
