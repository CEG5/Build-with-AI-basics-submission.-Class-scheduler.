<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="soft" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="9" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.1" diffuseConstant="1" lighting-color="#8f959b">
        <feDistantLight azimuth="225" elevation="62"/>
      </feDiffuseLighting>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="4" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" surfaceScale=".5" diffuseConstant="1" lighting-color="#fff">
        <feDistantLight azimuth="225" elevation="70"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <rect width="512" height="512" filter="url(#soft)"/>
  <rect width="512" height="512" filter="url(#grain)" opacity=".16" style="mix-blend-mode:multiply"/>
</svg>
