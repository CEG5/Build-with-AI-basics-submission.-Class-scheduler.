<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Blocks</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<canvas id="bg"></canvas>

<div class="stage">
  <div class="slab">
  <main class="panel" id="panel">
    <div class="panel-inner">
      <div class="views">
        <section class="day-section" aria-label="Daily schedule">
          <nav id="day-tabs" class="day-tabs"></nav>
          <div id="day-view" class="day-view"></div>
        </section>

        <div class="ridge" aria-hidden="true"></div>

        <section class="week-section" aria-label="Weekly schedule">
          <div class="week-head">
            <button id="week-indicator" class="week-indicator" type="button" aria-label="Set the current week"></button>
            <div id="upcoming" class="upcoming"></div>
          </div>
          <div class="week-body">
            <div id="week-view" class="week-view"></div>
            <button id="edge-left" class="edge-zone left" type="button" aria-label="Previous week"><span>&#8249;</span></button>
            <button id="edge-right" class="edge-zone right" type="button" aria-label="Next week"><span>&#8250;</span></button>
          </div>
        </section>
      </div>

      <footer class="bottom">
        <div id="plus-menu" class="plus-menu" hidden>
          <button type="button" data-action="join">Join a class</button>
          <button type="button" data-action="create">Create a class</button>
        </div>
        <button id="plus-btn" class="plus-btn" type="button" aria-label="Add a class">+</button>
        <div id="my-classes" class="my-classes"></div>
      </footer>
    </div>
  </main>
  </div>
</div>

<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="js/chip.js"></script>
<script src="js/store.js"></script>
<script src="js/time.js"></script>
<script src="js/carve.js"></script>
<script src="js/week-view.js"></script>
<script src="js/day-view.js"></script>
<script src="js/upcoming.js"></script>
<script src="js/week-nav.js"></script>
<script src="js/forms.js"></script>
<script src="js/background.js"></script>
<script src="js/animations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
