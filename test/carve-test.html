<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Carve test</title>
<style>body{background:#16181b;color:#e8eaed;font-family:Segoe UI,sans-serif;padding:16px}table{border-collapse:collapse}td,th{padding:6px 12px;vertical-align:middle;text-align:left}svg{background:#1d2024}.ok{color:#8fd19e}.bad{color:#ef7b77}</style></head>
<body><h2>Carve engine check</h2>
<p>Each row carves a block from its bottom-right corner. "Measured" is the area actually removed; it should match the target (midterm 1/3, final 1/2, quiz 20% to 50%).</p>
<table id="t"><tr><th>Case</th><th>Direction</th><th>Target</th><th>Measured</th><th>Result</th><th>Picture</th></tr></table>
<script src="../js/carve.js"></script>
<script>
var colours = ['#2F5FD0', '#D9622B', '#2F8A68'];
var cases = [
  ['Midterm', { type: 'midterm' }], ['Final', { type: 'final' }],
  ['Quiz, slider 0', { type: 'quiz', importance: 0 }], ['Quiz, slider 0.25', { type: 'quiz', importance: 0.25 }],
  ['Quiz, slider 0.5', { type: 'quiz', importance: 0.5 }], ['Quiz, slider 0.75', { type: 'quiz', importance: 0.75 }],
  ['Quiz, slider 1', { type: 'quiz', importance: 1 }]
];
var t = document.getElementById('t'), allOk = true;
cases.forEach(function (c, i) {
  [0, 1, 2].forEach(function (n) {
    var item = Object.assign({ id: 'seed' + i + '-' + n, day: 0, startMin: 0 }, c[1]);
    var g = { x: 10, y: 10, w: 84, h: 56, rx: 3 };
    var f = Carve.fit(g, [item]);
    var ok = Math.abs(f.coverage - f.target) < 0.03;
    allOk = allOk && ok;
    var res = Carve.blockCarves(g, [item], colours[n], 'c' + i + n);
    var row = t.insertRow();
    row.innerHTML = '<td>' + c[0] + ' (shape ' + (n + 1) + ')</td><td>' + (f.orient === 'up' ? 'right side' : 'along the bottom') + '</td><td>' + f.target.toFixed(3) + '</td><td>' + f.coverage.toFixed(3) + '</td><td class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'ok' : 'off') + '</td><td><svg viewBox="0 0 104 76" width="208" height="152"><defs>' + res.defs + '</defs><rect x="10" y="10" width="84" height="56" rx="3" fill="' + colours[n] + '" mask="url(#' + res.maskId + ')"/>' + res.carves + '</svg></td>';
  });
});
document.title = allOk ? 'Carve test: ALL OK' : 'Carve test: SOME OFF';
</script></body></html>
